
<div class="container">
    <h2>Checkout</h2>
    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label>Nome</label>
        <input type="text" class="form-control" [(ngModel)]="order.name" name="name" required>
      </div>
      <div class="mb-3">
        <label>E-mail</label>
        <input type="email" class="form-control" [(ngModel)]="order.email" name="email" required>
      </div>
      <div class="mb-3">
        <label>Endereço</label>
        <input type="text" class="form-control" [(ngModel)]="order.address" name="address" required>
      </div>
      <div class="mb-3">
        <label>Forma de Pagamento</label>
        <select class="form-control" [(ngModel)]="order.paymentMethod" name="paymentMethod">
          <option value="Pix">Pix</option>
          <option value="Cartão">Cartão</option>
          <option value="Boleto">Boleto</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success">Finalizar Compra</button>
    </form>
  </div>
